<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Deposit</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      background: white;
      width: 380px;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.12);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 25px;
      background: #0066cc;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #004c99;
    }

    .notice {
      margin-top: 20px;
      font-size: 13px;
      color: #666;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="container">
  <h1>Make a Deposit</h1>

  <form id="depositForm">

    <label for="account">Account Number</label>
    <input
      type="text"
      id="account"
      placeholder="Enter account number"
      required
    >

    <label for="amount">Deposit Amount (ZAR)</label>
    <input
      type="number"
      id="amount"
      min="1"
      step="0.01"
      placeholder="R0.00"
      required
    >

    <button type="submit">
      Continue to Secure Payment
    </button>

  </form>

  <div class="notice">
    Your payment will be processed through a secure payment provider.
  </div>
</div>

<script>
document.getElementById("depositForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const account = document.getElementById("account").value;
    const amount = document.getElementById("amount").value;

    if (!account || !amount || amount <= 0) {
        alert("Please enter valid deposit details.");
        return;
    }

    // In a real system, send these details to your secure backend.
    // The backend should create a payment request
    // through your approved payment provider.

    alert(
      "Deposit request created for R" +
      Number(amount).toFixed(2) +
      ". Proceeding to secure payment."
    );
});
</script>

</body>
</html>
